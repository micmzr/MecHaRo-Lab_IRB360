trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

controller_names:
  - joint_trajectory_controller

joint_trajectory_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_1_1_1
      - joint_1_1_2
      - joint_1_1_3
      - joint_1_2_1
      - joint_1_2_2
      - joint_1_2_3
      - joint_2_1_1
      - joint_2_1_2
      - joint_2_1_3
      - joint_2_2_1
      - joint_2_2_2
      - joint_2_2_3
      - joint_3_1_1
      - joint_3_1_2
      - joint_3_1_3
      - joint_3_2_1
      - joint_3_2_2
      - joint_3_2_3
      - joint_4_2
      - joint_4_3
      - joint_4_3
      - joint_4_4
      - joint_4_5
      - joint_4_6
      - joint_4_7      
